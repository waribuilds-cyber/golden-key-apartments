# Netlify deployment configuration for Lagos Luxe Stays
# ------------------------------------------------------
# The app is a TanStack Start (Nitro) project. We build with the Nitro
# "netlify" preset, publish the static client assets, and serve SSR through
# a single Netlify Function.

[build]
  command = "bun run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  # Tell Nitro to target Netlify instead of the default Cloudflare preset.
  NITRO_PRESET = "netlify"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Ensure the built server output is available to the function at deploy time.
  included_files = ["dist/server/**"]

# Serve everything that is not a static file through the SSR function.
# Static assets in dist/client are matched first, so they are served directly.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200